name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  dotnet-vulnerable-packages:
    name: dotnet vulnerable packages (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FamilyShop.slnx
        working-directory: backend
      - name: Check for vulnerable packages
        run: |
          set -o pipefail
          report=$(dotnet list FamilyShop.slnx package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -qi "has the following vulnerable packages"; then
            echo "Vulnerable packages detected."
            exit 1
          fi
        working-directory: backend
