name: Secret scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history is scanned, not only the last commit
          persist-credentials: false
      # The binary is downloaded from the release and checked against a pinned SHA-256 instead of using a third-party
      # action: nothing but the checksum has to be trusted, and no token or licence is involved.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -  # public release checksum (example of a pinned hash), not a secret
          tar -xzf gitleaks.tar.gz gitleaks
      # --redact: the log shows where a finding is, never the value.
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose --config .gitleaks.toml .
