name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: dotnet test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FamilyShop.slnx
        working-directory: backend
      - name: Test
        run: dotnet test FamilyShop.slnx --no-restore --configuration Release --logger "trx;LogFileName=results.trx"
        working-directory: backend
      # Names and messages of failed tests as check annotations, so a red run is readable without downloading logs.
      - name: Failed tests summary
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('backend/**/results.trx', recursive=True):
              for r in ET.parse(f).getroot().iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      msg = r.find('.//t:Message', ns)
                      text = ((msg.text or '') if msg is not None else '').strip().replace('\n', ' | ')[:900]
                      print(f"::error title=Failed test::{r.get('testName')}: {text}")
          PY

  frontend-tests:
    name: npm run test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
