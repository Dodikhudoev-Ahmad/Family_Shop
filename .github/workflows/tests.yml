name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: dotnet test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FamilyShop.slnx
        working-directory: backend
      - name: Test
        run: dotnet test FamilyShop.slnx --no-restore --configuration Release
        working-directory: backend

  frontend-tests:
    name: npm run test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
