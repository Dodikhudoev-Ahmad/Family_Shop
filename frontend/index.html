<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- CSP via <meta>: the static host sets no security headers of its own. frame-ancestors /
         X-Frame-Options can't be expressed in a meta tag and must come from the host config.
         The sha256 below is the inline theme script - update it if that script changes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-8cF9N8ncL/1WMoP/tKq10r9tay71LNN1yFSuKqnjtA4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' %API_ORIGIN%; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          // First visit (nothing saved) is always light: the device's own dark-mode setting is
          // deliberately not consulted. Only an explicit saved 'dark' switches it.
          var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>Family Shop — интернет-магазин одежды в Казахстане</title>
    <meta
      name="description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <!-- %VITE_SITE_URL% is the VITE_SITE_URL build variable (https://www.familyshop10.kz); a production build
         without it fails (vite.config.ts, src/lib/siteUrl.ts). Per-page tags are set at runtime by src/hooks/useSeo.ts;
         crawlers that do not run JS (WhatsApp, Telegram) see only the tags below - see docs/Seo.md. -->
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:site_name" content="Family Shop" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Family Shop — интернет-магазин одежды в Казахстане" />
    <meta
      property="og:description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Family Shop — интернет-магазин одежды в Казахстане" />
    <meta
      name="twitter:description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
