<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>Family Shop — интернет-магазин одежды в Казахстане</title>
    <meta
      name="description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <!-- TODO: %VITE_SITE_URL% comes from the VITE_SITE_URL env var (see .env / src/data/seo.ts)
         and falls back to the familyshop.example placeholder below when unset. Set it in the
         deploy environment instead of editing these tags by hand. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:site_name" content="Family Shop" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Family Shop — интернет-магазин одежды в Казахстане" />
    <meta
      property="og:description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <!-- TODO: temporary SVG placeholder (public/logo-icon-badge.svg) - swap for a real
         1200x630 photo before launch, see src/data/seo.ts for the full note. -->
    <meta property="og:image" content="%VITE_SITE_URL%/logo-icon-badge.svg" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Family Shop — интернет-магазин одежды в Казахстане" />
    <meta
      name="twitter:description"
      content="Женская, мужская и детская одежда, обувь и сумки с быстрой доставкой по Казахстану. Минимализм и качество в каждой вещи."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/logo-icon-badge.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
